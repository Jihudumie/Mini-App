<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masomo - Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    background-color: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
  }

  h1 { font-size: 20px; margin-bottom: 16px; }

  .lesson-item {
    background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .lesson-item img {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    object-fit: cover;
  }

  .lesson-item .info { flex: 1; }
  .lesson-item .title { font-weight: 600; font-size: 15px; }
  .lesson-item .subtitle { font-size: 13px; opacity: 0.7; }

  #lessonView { display: none; }

  #lessonView img {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 14px;
  }

  #lessonView h2 { font-size: 19px; margin-bottom: 10px; }
  #lessonView p {
    font-size: 15px;
    line-height: 1.6;
    white-space: pre-line; /* Hii inafanya \n na \n\n ndani ya content ionekane kama nafasi/aya mpya */
  }

  .hidden { display: none; }

  /* Ujumbe unaoonekana wakati masomo yanapakuliwa */
  #loadingMsg { text-align: center; opacity: 0.6; padding: 20px; }
</style>
</head>
<body>

  <div id="lessonList">
    <h1>📚 Masomo</h1>
    <div id="loadingMsg">Inapakia masomo...</div>
    <div id="listContainer"></div>
  </div>

  <div id="lessonView">
    <img id="lessonImage" src="" alt="Picha ya somo" />
    <h2 id="lessonTitle"></h2>
    <p id="lessonContent"></p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const listContainer = document.getElementById("listContainer");
    const loadingMsg = document.getElementById("loadingMsg");

    // ============================================
    // HAPA NDIYO MABADILIKO MUHIMU:
    // Badala ya kuandika masomo ndani ya JS, tunayasoma
    // kutoka faili la nje "masomo.json" kwa kutumia fetch()
    // ============================================
    fetch("masomo.json")
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Imeshindwa kupakia masomo.json");
        }
        return response.json();
      })
      .then(function (masomo) {
        loadingMsg.style.display = "none";
        onyeshaOrodha(masomo);
      })
      .catch(function (error) {
        loadingMsg.textContent = "Samahani, imeshindwa kupakia masomo. Jaribu tena baadaye.";
        console.error(error);
      });

    // ============================================
    // Onyesha orodha ya masomo kwenye ukurasa
    // ============================================
    function onyeshaOrodha(masomo) {
      masomo.forEach(function (somo) {
        const item = document.createElement("div");
        item.className = "lesson-item";
        item.innerHTML = `
          <img src="${somo.image}" alt="${somo.title}" />
          <div class="info">
            <div class="title">${somo.title}</div>
            <div class="subtitle">${somo.subtitle}</div>
          </div>
        `;
        item.addEventListener("click", function () {
          fungualSomo(somo);
        });
        listContainer.appendChild(item);
      });
    }

    // ============================================
    // Fungua somo moja (badilisha ukurasa)
    // ============================================
    function fungualSomo(somo) {
      document.getElementById("lessonImage").src = somo.image;
      document.getElementById("lessonTitle").textContent = somo.title;
      document.getElementById("lessonContent").textContent = somo.content;

      document.getElementById("lessonList").classList.add("hidden");
      document.getElementById("lessonView").style.display = "block";

      tg.BackButton.show();
    }

    tg.BackButton.onClick(function () {
      document.getElementById("lessonView").style.display = "none";
      document.getElementById("lessonList").classList.remove("hidden");
      tg.BackButton.hide();
    });
  </script>

</body>
</html>
