<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masomo - Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    background-color: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
  }

  h1 { font-size: 20px; margin-bottom: 16px; }

  .lesson-item {
    background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .lesson-item img {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    object-fit: cover;
  }

  .lesson-item .info { flex: 1; }
  .lesson-item .title { font-weight: 600; font-size: 15px; }
  .lesson-item .subtitle { font-size: 13px; opacity: 0.7; }

  #lessonView { display: none; }

  #lessonView img {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 14px;
  }

  #lessonView h2 { font-size: 19px; margin-bottom: 10px; }

  /* Rangi ya mistari yenye HERUFI KUBWA ZOTE (kama FAIDA:, FADHILA ZA SUWRAH:) */
  .content-heading {
    color: #22a559; /* kijani */
    font-weight: 700;
    font-size: 16px;
    margin: 18px 0 6px 0;
  }

  /* Rangi ya maandishi ya kawaida chini ya vichwa */
  .content-body {
    color: #1a73e8; /* buluu */
    font-size: 15px;
    line-height: 1.6;
    margin: 0 0 10px 0;
  }

  /* Kisanduku maalum kwa Aayah za Qur-aan na Hadiyth */
  .content-quote {
    background-color: var(--tg-theme-secondary-bg-color, #f0f4f8);
    border-left: 4px solid #22a559;
    padding: 12px 14px;
    margin: 12px 0;
    border-radius: 8px;
    font-style: italic;
    font-size: 15px;
    line-height: 1.7;
    color: var(--tg-theme-text-color, #000000);
    /* unicode-bidi: plaintext huruhusu Kiarabu (kulia-kushoto) na
       Kiswahili (kushoto-kulia) kuchanganyika kwa usahihi mstari mmoja */
    unicode-bidi: plaintext;
  }

  /* Muonekano wa Aayah za Qur-aan zinazotoka kwenye quran/*.json */
  .quran-verse {
    background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
    border-radius: 12px;
    padding: 14px;
    margin: 12px 0;
  }

  .quran-number {
    font-size: 13px;
    font-weight: 700;
    opacity: 0.65;
    margin-bottom: 10px;
  }

  .quran-arabic {
    direction: rtl;
    text-align: right;
    font-size: 24px;
    line-height: 2;
    margin: 0 0 12px 0;
    font-family: "Noto Naskh Arabic", "Amiri", serif;
  }

  .quran-translation {
    font-size: 15px;
    line-height: 1.7;
    margin: 0;
  }

  .quran-source {
    font-size: 13px;
    opacity: 0.65;
    margin-top: 18px;
  }

  .hidden { display: none; }

  /* Ujumbe unaoonekana wakati masomo yanapakuliwa */
  #loadingMsg { text-align: center; opacity: 0.6; padding: 20px; }
</style>
</head>
<body>

  <div id="lessonList">
    <h1>📚 Masomo</h1>
    <div id="loadingMsg">Inapakia masomo...</div>
    <div id="listContainer"></div>
  </div>

  <div id="lessonView">
    <img id="lessonImage" src="" alt="Picha ya somo" />
    <h2 id="lessonTitle"></h2>
    <div id="lessonContent"></div>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const listContainer = document.getElementById("listContainer");
    const loadingMsg = document.getElementById("loadingMsg");

    // ============================================
    // HAPA NDIYO MABADILIKO MUHIMU:
    // Badala ya kuandika masomo ndani ya JS, tunayasoma
    // kutoka faili la nje "masomo.json" kwa kutumia fetch()
    // ============================================
    fetch("masomo.json")
      .then(function (response) {
        if (!response.ok) {
          throw new Error("Imeshindwa kupakia masomo.json");
        }
        return response.json();
      })
      .then(function (masomo) {
        loadingMsg.style.display = "none";
        onyeshaOrodha(masomo);
      })
      .catch(function (error) {
        loadingMsg.textContent = "Samahani, imeshindwa kupakia masomo. Jaribu tena baadaye.";
        console.error(error);
      });

    // ============================================
    // Onyesha orodha ya masomo kwenye ukurasa
    // ============================================
    function onyeshaOrodha(masomo) {
      masomo.forEach(function (somo) {
        const item = document.createElement("div");
        item.className = "lesson-item";
        item.innerHTML = `
          <img src="${somo.image}" alt="${somo.title}" />
          <div class="info">
            <div class="title">${somo.title}</div>
            <div class="subtitle">${somo.subtitle}</div>
          </div>
        `;
        item.addEventListener("click", function () {
          fungualSomo(somo);
        });
        listContainer.appendChild(item);
      });
    }

    // ============================================
    // Fungua somo moja (badilisha ukurasa)
    // ============================================
    async function fungualSomo(somo) {
      document.getElementById("lessonImage").src = somo.image || "";
      document.getElementById("lessonTitle").textContent = somo.title;

      const lessonContent = document.getElementById("lessonContent");
      lessonContent.innerHTML = '<p class="content-body">Inapakia maudhui...</p>';

      document.getElementById("lessonList").classList.add("hidden");
      document.getElementById("lessonView").style.display = "block";
      tg.BackButton.show();

      try {
        // Masomo ya kawaida yana "content" moja kwa moja.
        if (somo.content) {
          lessonContent.innerHTML = pangaRangiYaContent(somo.content);
          return;
        }

        // Qur-aan na content kubwa hutumia faili tofauti, mfano quran/002.json.
        if (somo.content_url) {
          const response = await fetch(somo.content_url);
          if (!response.ok) {
            throw new Error("Imeshindwa kupakia: " + somo.content_url);
          }

          const data = await response.json();

          if (Array.isArray(data.verses)) {
            lessonContent.innerHTML = pangaAayah(data);
          } else {
            throw new Error("Faili halina verses[]");
          }
          return;
        }

        lessonContent.innerHTML = '<p class="content-body">Maudhui ya somo hayajapatikana.</p>';
      } catch (error) {
        lessonContent.innerHTML = '<p class="content-body">Samahani, imeshindwa kupakia maudhui ya somo.</p>';
        console.error(error);
      }
    }

    // ============================================
    // Onyesha Aayah zinazotoka kwenye quran/00X.json
    // ============================================
    function pangaAayah(data) {
      let html = "";

      data.verses.forEach(function (ayah) {
        html += `
          <div class="quran-verse">
            <div class="quran-number">Aayah ${ayah.number}</div>
            <p class="quran-arabic" dir="rtl">${escapeHtml(ayah.arabic)}</p>
            <p class="quran-translation">${escapeHtml(ayah.translation)}</p>
          </div>
        `;
      });

      if (data.source) {
        html += `<p class="quran-source">Chanzo: ${escapeHtml(data.source)}</p>`;
      }

      return html;
    }

    // Zuia HTML isiyo kusudiwa kuingia kwenye content kutoka JSON.
    function escapeHtml(text) {
      return String(text ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    // ============================================
    // Function hii inasoma content mstari kwa mstari.
    // Ikiwa mstari umeandikwa kwa HERUFI KUBWA ZOTE (kama "FAIDA:"),
    // unapewa class ya "content-heading" (kijani).
    // Mistari mingine yote inapewa class ya "content-body" (buluu).
    // ============================================
    function pangaRangiYaContent(text) {
      const mistari = text.split("\n");
      let html = "";

      mistari.forEach(function (mstari) {
        const mstariUlioSafishwa = mstari.trim();

        if (mstariUlioSafishwa === "") {
          return; // ruka mistari mitupu
        }

        // Mstari unaoanza na ">" ni Aayah au Hadiyth - kisanduku maalum
        if (mstariUlioSafishwa.startsWith(">")) {
          const bilaAlama = mstariUlioSafishwa.substring(1).trim();
          html += `<p class="content-quote">${bilaAlama}</p>`;
          return;
        }

        // Angalia kama mstari huu ni HERUFI KUBWA ZOTE (heading)
        // Mfano: "FAIDA:" au "FADHILA ZA SUWRAH:"
        const niHeading = mstariUlioSafishwa === mstariUlioSafishwa.toUpperCase()
                          && /[A-Z]/.test(mstariUlioSafishwa);

        if (niHeading) {
          html += `<p class="content-heading">${mstariUlioSafishwa}</p>`;
        } else {
          html += `<p class="content-body">${mstariUlioSafishwa}</p>`;
        }
      });

      return html;
    }

    tg.BackButton.onClick(function () {
      document.getElementById("lessonView").style.display = "none";
      document.getElementById("lessonList").classList.remove("hidden");
      tg.BackButton.hide();
    });
  </script>

</body>
</html>
