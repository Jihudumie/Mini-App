<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mfano wa Telegram Mini App</title>

<!-- Hii ndiyo script MUHIMU inayounganisha ukurasa wako na Telegram -->
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  /* Telegram inatuma "theme colors" za mtumiaji (dark/light mode).
     Tunazitumia hapa ili app yako ionekane sawa na Telegram yenyewe. */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 20px;
    background-color: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
  }

  h1 {
    font-size: 22px;
    margin-bottom: 10px;
  }

  .card {
    background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
    padding: 16px;
    border-radius: 12px;
    margin-bottom: 16px;
  }

  button {
    background-color: var(--tg-theme-button-color, #2481cc);
    color: var(--tg-theme-button-text-color, #ffffff);
    border: none;
    padding: 12px 20px;
    border-radius: 8px;
    font-size: 16px;
    width: 100%;
    cursor: pointer;
  }

  #userInfo {
    font-size: 14px;
    opacity: 0.8;
  }
</style>
</head>
<body>

  <h1>👋 Karibu kwenye Mini App yangu</h1>

  <div class="card">
    <p>Habari, <span id="userName">Mgeni</span>!</p>
    <p id="userInfo">Taarifa za mtumiaji zitaonekana hapa...</p>
  </div>

  <div class="card">
    <p>Bonyeza kitufe hapa chini kutuma data kwa bot yako:</p>
    <button id="sendBtn">Tuma Data kwa Bot</button>
  </div>

  <script>
    // ============================================
    // HATUA 1: Pata object ya WebApp kutoka Telegram
    // ============================================
    const tg = window.Telegram.WebApp;

    // Muhimu: Mwambie Telegram kuwa app yako iko tayari
    tg.ready();

    // Panua app ili ichukue nafasi kamili ya skrini
    tg.expand();

    // ============================================
    // HATUA 2: Pata taarifa za mtumiaji
    // ============================================
    // initDataUnsafe ina taarifa za mtumiaji (jina, id, n.k.)
    // ONYO: hii "unsafe" kwa sababu haijathibitishwa (verified).
    // Kwa mambo muhimu (kama malipo au data nyeti), lazima
    // uthibitishe "initData" (si "initDataUnsafe") upande wa SERVER yako.
    const user = tg.initDataUnsafe?.user;

    if (user) {
      document.getElementById("userName").textContent = user.first_name;
      document.getElementById("userInfo").textContent =
        `ID: ${user.id} | Username: @${user.username || "haipo"}`;
    }

    // ============================================
    // HATUA 3: Onyesha MainButton ya Telegram
    // ============================================
    // Hii ni kitufe kinachotolewa na Telegram chenyewe (kinabaki
    // chini ya skrini), tofauti na button ya kawaida ya HTML
    tg.MainButton.setText("Funga Mini App");
    tg.MainButton.show();

    tg.MainButton.onClick(function () {
      tg.close(); // Hufunga Mini App
    });

    // ============================================
    // HATUA 4: Tuma data kutoka Mini App kwenda kwa Bot
    // ============================================
    document.getElementById("sendBtn").addEventListener("click", function () {
      // sendData hutuma ujumbe kwa bot yako (backend) kama tukio
      // Bot yako itapokea hii kama "web_app_data" update
      tg.sendData(JSON.stringify({
        action: "salamu",
        jina: user ? user.first_name : "Mgeni",
        muda: new Date().toISOString()
      }));
    });

    // ============================================
    // MFANO ZAIDI: Kutumia BackButton
    // ============================================
    // tg.BackButton.show();
    // tg.BackButton.onClick(() => { /* fanya kitu */ });

    // ============================================
    // MFANO ZAIDI: Kubadilisha rangi ya "header" ya Telegram
    // ============================================
    // tg.setHeaderColor('#2481cc');
  </script>

</body>
</html>
