<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masomo - Mini App</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    margin: 0;
    padding: 16px;
    background-color: var(--tg-theme-bg-color, #ffffff);
    color: var(--tg-theme-text-color, #000000);
  }

  h1 { font-size: 20px; margin-bottom: 16px; }

  /* Kadi ya kila somo kwenye orodha */
  .lesson-item {
    background-color: var(--tg-theme-secondary-bg-color, #f0f0f0);
    padding: 14px;
    border-radius: 12px;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: pointer;
  }

  .lesson-item img {
    width: 50px;
    height: 50px;
    border-radius: 8px;
    object-fit: cover;
  }

  .lesson-item .info { flex: 1; }
  .lesson-item .title { font-weight: 600; font-size: 15px; }
  .lesson-item .subtitle { font-size: 13px; opacity: 0.7; }

  /* Ukurasa wa somo moja */
  #lessonView { display: none; }

  #lessonView img {
    width: 100%;
    border-radius: 12px;
    margin-bottom: 14px;
  }

  #lessonView h2 { font-size: 19px; margin-bottom: 10px; }
  #lessonView p { font-size: 15px; line-height: 1.6; }

  .hidden { display: none; }
</style>
</head>
<body>

  <!-- ============================================ -->
  <!-- UKURASA WA 1: Orodha ya masomo -->
  <!-- ============================================ -->
  <div id="lessonList">
    <h1>📚 Masomo</h1>
    <div id="listContainer"></div>
  </div>

  <!-- ============================================ -->
  <!-- UKURASA WA 2: Somo moja (linaonekana ukibonyeza) -->
  <!-- ============================================ -->
  <div id="lessonView">
    <img id="lessonImage" src="" alt="Picha ya somo" />
    <h2 id="lessonTitle"></h2>
    <p id="lessonContent"></p>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // ============================================
    // HAPA NDIPO UNAPOONGEZA MASOMO YAKO
    // ============================================
    // Kila somo lina: id, title (kichwa), subtitle (maelezo mafupi
    // kwenye orodha), image (link ya picha), na content (maandishi kamili)
    const masomo = [
      {
        id: 1,
        title: "Somo la 1: Utangulizi wa Biolojia",
        subtitle: "Ni nini biolojia na kwa nini tunaisoma",
        image: "https://placehold.co/600x300?text=Somo+la+1",
        content: "Biolojia ni sayansi inayosoma viumbe hai na mwingiliano wao na mazingira. " +
                  "Inatusaidia kuelewa jinsi mwili wa binadamu, wanyama, na mimea vinavyofanya kazi. " +
                  "Katika somo hili tutaangalia dhana za msingi kabla ya kwenda kwa undani zaidi."
      },
      {
        id: 2,
        title: "Somo la 2: Seli - Kiini cha Uhai",
        subtitle: "Aina za seli na kazi zake",
        image: "https://placehold.co/600x300?text=Somo+la+2",
        content: "Seli ni kitengo kidogo kabisa cha uhai. Kuna aina mbili kuu za seli: " +
                  "seli za mimea (zenye ukuta wa seli na kloroplast) na seli za wanyama. " +
                  "Kila sehemu ya seli (organelle) ina kazi maalum, kama vile kiini (nucleus) " +
                  "kinachohifadhi taarifa za kijenetiki."
      },
      {
        id: 3,
        title: "Somo la 3: Mfumo wa Damu",
        subtitle: "Jinsi moyo na damu vinavyofanya kazi",
        image: "https://placehold.co/600x300?text=Somo+la+3",
        content: "Mfumo wa damu (circulatory system) unahusisha moyo, mishipa ya damu, na damu " +
                  "yenyewe. Moyo husukuma damu yenye oksijeni kwenda kwenye mwili mzima, " +
                  "na kurudisha damu yenye kaboni dioksidi kwenye mapafu kwa ajili ya kubadilishwa."
      }
    ];

    // ============================================
    // Onyesha orodha ya masomo kwenye ukurasa
    // ============================================
    const listContainer = document.getElementById("listContainer");

    masomo.forEach(function (somo) {
      const item = document.createElement("div");
      item.className = "lesson-item";
      item.innerHTML = `
        <img src="${somo.image}" alt="${somo.title}" />
        <div class="info">
          <div class="title">${somo.title}</div>
          <div class="subtitle">${somo.subtitle}</div>
        </div>
      `;
      // Ukibonyeza somo, fungua ukurasa wa somo hilo
      item.addEventListener("click", function () {
        fungualSomo(somo);
      });
      listContainer.appendChild(item);
    });

    // ============================================
    // Fungua somo moja (badilisha ukurasa)
    // ============================================
    function fungualSomo(somo) {
      document.getElementById("lessonImage").src = somo.image;
      document.getElementById("lessonTitle").textContent = somo.title;
      document.getElementById("lessonContent").textContent = somo.content;

      document.getElementById("lessonList").classList.add("hidden");
      document.getElementById("lessonView").style.display = "block";

      // Onyesha BackButton ya Telegram (chini/juu kulingana na device)
      tg.BackButton.show();
    }

    // ============================================
    // Rudi kwenye orodha ukibonyeza BackButton
    // ============================================
    tg.BackButton.onClick(function () {
      document.getElementById("lessonView").style.display = "none";
      document.getElementById("lessonList").classList.remove("hidden");
      tg.BackButton.hide();
    });
  </script>

</body>
</html>
